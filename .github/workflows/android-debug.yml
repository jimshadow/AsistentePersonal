name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Dependencias (libreria)
        run: npm ci

      - name: Generar codigo Nitro
        run: npx nitrogen

      - name: Dependencias (example)
        run: npm ci
        working-directory: example

      - name: Modelo MediaPipe
        run: |
          D=example/android/app/src/main/assets
          mkdir -p $D
          [ -f $D/pose_landmarker_lite.task ] || curl -fL -o $D/pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task

      - name: Build Debug APK
        working-directory: example/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --max-workers=2 --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: example/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

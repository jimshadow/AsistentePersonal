name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17' # Java 17 es el estándar más estable para RN 0.88.x

      - name: Setup Android SDK
        run: |
          echo "SDK Path: $ANDROID_HOME"
          echo "SDK Root: $ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || echo "No cmdline-tools in $ANDROID_HOME"
          ls -la "$ANDROID_SDK_ROOT/cmdline-tools/" 2>/dev/null || echo "No cmdline-tools in $ANDROID_SDK_ROOT"
          echo "---"
          echo "Platform 33:"
          ls -la "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms in $ANDROID_HOME"
          echo "---"
          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK in $ANDROID_HOME"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon --no-parallel --max-workers=1 --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
